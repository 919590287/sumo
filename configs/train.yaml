# 训练配置（docs/DESIGN.md §6）。设备由 B2S_DEVICE ∈ {auto, cuda, mps, cpu} 选择，代码中不硬编码。

layer1:
  seed: 20261127
  epochs: 12                # 服务器 CUDA 校准后定案（§8）
  batch_size: 4
  grad_accum: 2
  max_pairs_per_batch: 1    # 单批最多保留的跨块对比样本对数（约束最坏窗口数 ≤ batch_size + max_pairs_per_batch，防 OOM）
  lr: 2.0e-4
  lr_backbone: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  min_lr_ratio: 0.05
  grad_clip: 5.0
  num_workers: 8
  prefetch_factor: 2
  amp: auto                 # auto：按 calibration.json 的判定；fp32 / bf16 / fp16 可显式指定
  val_every_steps: 2000
  val_samples: 200
  ckpt_every_steps: 1000
  log_every_steps: 20
  train_split: train
  val_split: val

smoke:                      # 本机 MPS 冒烟（少量样本过拟合 + 数百步收敛检查）
  overfit_samples: 4
  overfit_steps: 300
  fixed_px: 512
  steps: 200
  batch_size: 2
  num_workers: 2
  lr: 3.0e-4
  pass_ratio: 0.5           # 过拟合末段损失 ≤ 初始损失 × 该比例 即判通过

calibration:
  amp_grad_cos_min: 0.99    # AMP 与 fp32 梯度余弦相似度门槛（§6.1-3）
  bench_steps: 10
  px: 896
  max_batch_try: [1, 2, 3, 4, 6, 8, 12, 16]
  mem_headroom: 0.85        # 显存内最大窗口数：峰值显存 ≤ 总显存 × 该比例
  min_free_vram_gib: 18     # 自检：空闲显存门槛（校准后按实测峰值 + 余量更新）
